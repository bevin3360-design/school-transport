<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>My School Transport – Login</title>
<meta name="theme-color" content="#1a5276"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="My School Transport"/>
<link rel="icon" type="image/png" sizes="192x192" href="/static/icons/icon-192.png"/>
<link rel="shortcut icon" href="/static/icons/icon-192.png"/>
<link rel="manifest" href="/static/manifest.json"/>
<link rel="apple-touch-icon" href="/static/icons/icon-192.png"/>
<link rel="stylesheet" href="/static/css/style.css"/>
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <div class="logo-area">
      <img src="/static/icons/icon-192.png" alt="My School Transport" style="width:80px;height:80px;border-radius:16px;margin-bottom:1rem;"/>
      <h1>My School Transport</h1>
      <p class="subtitle">Manage. Allocate. Track. — Powered by MST Platform</p>
    </div>
    <div class="tab-bar">
      <button class="tab-btn active" onclick="switchTab('teacher',this)">Teacher</button>
      <button class="tab-btn" onclick="switchTab('driver',this)">Driver</button>
      <button class="tab-btn" onclick="switchTab('parent',this)">Parent</button>
      <button class="tab-btn" onclick="switchTab('admin',this)">Admin</button>
      <button class="tab-btn" onclick="switchTab('super',this)">Super</button>
    </div>

    <!-- TEACHER -->
    <div id="tab-teacher" class="tab-content active">
      <div class="form-group"><label>School Code</label>
        <input type="text" id="t-school" placeholder="e.g. FSL001" autocomplete="off"/></div>
      <div class="form-group"><label>Teaching Code</label>
        <input type="text" id="t-code" placeholder="e.g. TCH018" autocomplete="off"/></div>
      <div class="form-group"><label>Passcode</label>
        <input type="password" id="t-pass" placeholder="Your passcode"/></div>
      <button class="btn-primary full" onclick="teacherLogin()">Sign In</button>
      <p id="t-err" class="error-msg hidden"></p>
    </div>

    <!-- DRIVER -->
    <div id="tab-driver" class="tab-content">
      <div class="form-group"><label>School Code</label>
        <input type="text" id="d-school" placeholder="e.g. FSL001" autocomplete="off"/></div>
      <div class="form-group"><label>Phone Number</label>
        <input type="tel" id="d-phone" placeholder="0712345678" autocomplete="off"/></div>
      <div class="form-group"><label>Password</label>
        <input type="password" id="d-pass" placeholder="Your password"/></div>
      <button class="btn-primary full" onclick="driverLogin()">Sign In</button>
      <p id="d-err" class="error-msg hidden"></p>
    </div>

    <!-- PARENT -->
    <div id="tab-parent" class="tab-content">
      <div class="form-group"><label>School Code</label>
        <input type="text" id="p-school" placeholder="e.g. FSL001" autocomplete="off"/></div>
      <div class="form-group"><label>Phone Number</label>
        <input type="tel" id="p-phone" placeholder="0712345678" autocomplete="off"/></div>
      <div class="form-group"><label>Password</label>
        <input type="password" id="p-pass" placeholder="Your password"/></div>
      <button class="btn-primary full" onclick="parentLogin()">Sign In</button>
      <p id="p-err" class="error-msg hidden"></p>
    </div>

    <!-- ADMIN -->
    <div id="tab-admin" class="tab-content">
      <div class="form-group"><label>Username</label>
        <input type="text" id="a-user" placeholder="Admin username" autocomplete="off"/></div>
      <div class="form-group"><label>Password</label>
        <input type="password" id="a-pass" placeholder="Password"/></div>
      <button class="btn-primary full" onclick="adminLogin()">Sign In</button>
      <p id="a-err" class="error-msg hidden"></p>
      <p style="text-align:center;margin-top:1rem;font-size:.85rem;">
        New school? <a href="/register" style="color:var(--sky);font-weight:600;">Register here →</a>
      </p>
    </div>

    <!-- SUPER -->
    <div id="tab-super" class="tab-content">
      <div class="form-group"><label>Super Admin Username</label>
        <input type="text" id="s-user" placeholder="superadmin" autocomplete="off"/></div>
      <div class="form-group"><label>Password</label>
        <input type="password" id="s-pass" placeholder="Password"/></div>
      <button class="btn-primary full" onclick="superLogin()">Sign In</button>
      <p id="s-err" class="error-msg hidden"></p>
    </div>

    <div style="text-align:center;margin-top:1.5rem;font-size:.78rem;color:var(--muted);">
      <span class="badge-red">MST</span> Secure · Role-Based · Multi-School
    </div>

    <!-- Install App Button -->
    <button id="install-btn" class="btn-primary full" style="display:none;margin-top:1rem;background:linear-gradient(135deg,#2ecc71,#27ae60);border:none;box-shadow:0 4px 12px rgba(46,204,113,0.3);" onclick="installApp()">
      📱 Install App on This Device
    </button>
  </div>
</div>
<script>
function switchTab(tab, btn) {
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active'));
  document.getElementById('tab-'+tab).classList.add('active');
  btn.classList.add('active');
}
async function teacherLogin() {
  const school_code=document.getElementById('t-school').value.trim();
  const teaching_code=document.getElementById('t-code').value.trim();
  const passcode=document.getElementById('t-pass').value.trim();
  const err=document.getElementById('t-err');
  err.classList.add('hidden');
  const r=await fetch('/api/teacher/login',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({school_code,teaching_code,passcode})});
  const d=await r.json();
  if(d.success) window.location.href='/teacher';
  else{err.textContent=d.message||'Login failed';err.classList.remove('hidden');}
}
async function adminLogin() {
  const username=document.getElementById('a-user').value.trim();
  const password=document.getElementById('a-pass').value;
  const err=document.getElementById('a-err');
  err.classList.add('hidden');
  const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({username,password})});
  const d=await r.json();
  if(d.success) window.location.href='/admin';
  else{err.textContent=d.message||'Login failed';err.classList.remove('hidden');}
}
async function superLogin() {
  const username=document.getElementById('s-user').value.trim();
  const password=document.getElementById('s-pass').value;
  const err=document.getElementById('s-err');
  err.classList.add('hidden');
  const r=await fetch('/api/super/login',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({username,password})});
  const d=await r.json();
  if(d.success) window.location.href='/super';
  else{err.textContent=d.message||'Login failed';err.classList.remove('hidden');}
}
async function driverLogin() {
  const school_code=document.getElementById('d-school').value.trim();
  const phone=document.getElementById('d-phone').value.trim();
  const password=document.getElementById('d-pass').value;
  const err=document.getElementById('d-err');
  err.classList.add('hidden');
  const r=await fetch('/api/driver/login',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({school_code,phone,password})});
  const d=await r.json();
  if(d.success) window.location.href='/driver';
  else{err.textContent=d.message||'Login failed';err.classList.remove('hidden');}
}
async function parentLogin() {
  const school_code=document.getElementById('p-school').value.trim();
  const phone=document.getElementById('p-phone').value.trim();
  const password=document.getElementById('p-pass').value;
  const err=document.getElementById('p-err');
  err.classList.add('hidden');
  const r=await fetch('/api/parent/login',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({school_code,phone,password})});
  const d=await r.json();
  if(d.success) window.location.href='/parent';
  else{err.textContent=d.message||'Login failed';err.classList.remove('hidden');}
}
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;
  const active=document.querySelector('.tab-content.active').id;
  if(active==='tab-teacher')teacherLogin();
  else if(active==='tab-driver')driverLogin();
  else if(active==='tab-parent')parentLogin();
  else if(active==='tab-admin')adminLogin();
  else superLogin();
});
// ── PWA Install Prompt ──────────────────────────────
let deferredPrompt;

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById('install-btn').style.display = 'block';
});

async function installApp() {
  if (!deferredPrompt) {
    alert('App is already installed or not installable on this device');
    return;
  }
  deferredPrompt.prompt();
  const { outcome } = await deferredPrompt.userChoice;
  if (outcome === 'accepted') {
    document.getElementById('install-btn').style.display = 'none';
  }
  deferredPrompt = null;
}

// Hide button if already installed
window.addEventListener('appinstalled', () => {
  document.getElementById('install-btn').style.display = 'none';
});

// Check if already installed (iOS/Safari)
if (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone) {
  document.getElementById('install-btn').style.display = 'none';
}

// ── Service Worker Registration ──────────────────────
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/static/sw.js').catch(()=>{});
}
</script>
</body>
</html>
