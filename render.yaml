services:
  - type: web
    name: mytransport
    env: python
    region: oregon
    plan: free
    rootDir: sts-platform
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/start_railway.py
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DATABASE_URL
        sync: false

# Kept only as a rollback copy of the old database; the app now reads Neon.
databases:
  - name: mytransport-db
    plan: free
    region: oregon
